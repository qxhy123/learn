[project]
name = "deepagents-coding-platform"
version = "0.1.0"
description = "Runtime-first enterprise coding agent platform built on deepagents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "deepagents",
  "httpx>=0.27.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[tool.uv.sources]
deepagents = { path = "../deepagents/libs/deepagents", editable = true }

[project.scripts]
dacp = "deepagents_coding_platform.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
