<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Infra 教程导航</title>
<style>
:root{--ink:#1f2937;--muted:#5f6b7a;--line:#d8e0ea;--blue:#2563eb;--blue2:#dbeafe;--bg:#f8fbff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff}.wrap{padding:16px 12px 28px}.brand{font-weight:800;font-size:17px;line-height:1.3;margin:2px 4px 12px}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:3px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;outline:none;background:#fbfdff}input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{margin-top:12px}summary{cursor:pointer;font-weight:800;font-size:13px;color:#334155;list-style:none;padding:6px 4px}summary::-webkit-details-marker{display:none}.links{display:grid;gap:3px;margin-top:4px}.chapter{display:block;padding:8px 8px 8px 10px;border-left:4px solid transparent;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}.chapter:hover{background:var(--bg)}.chapter.active{background:var(--blue2);border-left-color:var(--blue);font-weight:800;color:#1d4ed8}.hidden{display:none}.empty{color:var(--muted);font-size:13px;padding:12px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">AI Infra 教程<span>从体系结构到平台工程</span></div>
  <input id="search" type="search" placeholder="搜索章节" autocomplete="off" />
  <div id="nav"></div>
</div>
<script src="assets/tutorial-data.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var current = params.get('current') || '';
  var nav = document.getElementById('nav');
  var search = document.getElementById('search');
  function draw(filter){
    var q = (filter || '').trim().toLowerCase();
    var html = ''; var shown = 0;
    TUTORIAL.forEach(function(group){
      var rows = (group.chapters || group.items || []).filter(function(item){ return !q || (item.id + ' ' + item.title + ' ' + item.path).toLowerCase().includes(q); });
      if(!rows.length) return; shown += rows.length;
      var open = rows.some(function(item){ return item.id === current; }) || !!q;
      html += '<details '+(open?'open':'')+'><summary>'+group.part+'</summary><div class="links">';
      rows.forEach(function(item){ html += '<a class="chapter '+(item.id===current?'active':'')+'" href="'+item.path+'" target="_top" data-id="'+item.id+'">'+item.title+'</a>'; });
      html += '</div></details>';
    });
    nav.innerHTML = html || '<div class="empty">没有匹配章节</div>';
  }
  search.addEventListener('input', function(){ draw(search.value); });
  window.addEventListener('message', function(ev){ if(ev.data && ev.data.type === 'current-chapter'){ current = ev.data.id; draw(search.value); } });
  draw('');
})();
</script>
</body>
</html>
