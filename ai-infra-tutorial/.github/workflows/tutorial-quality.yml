name: Tutorial Quality

on:
  push:
  pull_request:

jobs:
  tutorial-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check local Markdown and HTML links
        run: python3 scripts/check_local_links.py

      - name: Check generated HTML links
        run: python3 scripts/check_local_links.py --html-only

      - name: Check Markdown quality
        run: python3 scripts/check_markdown_quality.py
