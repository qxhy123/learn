[project]
name = "leetcode150"
version = "0.1.0"
description = "A metadata-driven Python tutorial scaffold for LeetCode Top Interview 150."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
