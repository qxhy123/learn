<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="40" y="34" font-size="13" fill="#64748b">AI Agent 系统</text>
  <text x="560" y="34" text-anchor="end" font-size="13" fill="#64748b">计算机系统</text>

  <!-- Agent ↔ Application -->
  <rect x="40" y="46" width="520" height="62" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="80" y="83" font-size="18" font-weight="700" fill="#0e7490">Agent</text>
  <text x="300" y="83" text-anchor="middle" font-size="16" fill="#334155">↔</text>
  <text x="520" y="83" text-anchor="end" font-size="15" fill="#475569">Application（应用程序）</text>

  <!-- Harness ↔ OS -->
  <rect x="40" y="120" width="520" height="62" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="157" font-size="18" font-weight="700" fill="#075985">Harness</text>
  <text x="300" y="157" text-anchor="middle" font-size="16" fill="#334155">↔</text>
  <text x="520" y="157" text-anchor="end" font-size="15" fill="#475569">OS（操作系统）</text>

  <!-- Context Window ↔ RAM -->
  <rect x="40" y="194" width="520" height="62" rx="11" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="80" y="231" font-size="17" font-weight="700" fill="#a16207">Context Window</text>
  <text x="300" y="231" text-anchor="middle" font-size="16" fill="#334155">↔</text>
  <text x="520" y="231" text-anchor="end" font-size="15" fill="#475569">RAM（内存 · 工作记忆）</text>

  <!-- Model ↔ CPU -->
  <rect x="40" y="268" width="520" height="62" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="305" font-size="18" font-weight="700" fill="#15803d">Model</text>
  <text x="300" y="305" text-anchor="middle" font-size="16" fill="#334155">↔</text>
  <text x="520" y="305" text-anchor="end" font-size="15" fill="#475569">CPU（执行推理/计算）</text>

  <text x="300" y="362" text-anchor="middle" font-size="13" fill="#64748b">再往下：外部存储 / RAG ↔ 文件系统　·　工具适配器 ↔ 设备驱动</text>
</svg>
