<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 主流程 -->
  <text x="42" y="118" font-size="14" fill="#64748b">输入</text>
  <line x1="70" y1="130" x2="118" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Guides 前馈：之前 -->
  <rect x="120" y="96" width="150" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="195" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Guides = 前馈</text>
  <text x="195" y="146" text-anchor="middle" font-size="12" fill="#15803d">调用「之前」预防</text>

  <line x1="270" y1="130" x2="318" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="320" y="96" width="120" height="68" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
  <text x="380" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#0e7490">Model 调用</text>

  <line x1="440" y1="130" x2="488" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sensors 反馈：之后 -->
  <rect x="490" y="96" width="118" height="68" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="549" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Sensors = 反馈</text>
  <text x="549" y="146" text-anchor="middle" font-size="12" fill="#b91c1c">调用「之后」检测</text>

  <text x="549" y="200" text-anchor="middle" font-size="14" fill="#64748b">输出</text>
  <line x1="549" y1="164" x2="549" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 反馈回环：从 Sensors 回到 Model -->
  <path d="M 490 210 Q 380 270 380 174" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
  <text x="430" y="262" text-anchor="middle" font-size="12.5" fill="#b91c1c">发现偏差 → 修正 / 重试</text>

  <text x="320" y="44" text-anchor="middle" font-size="13" fill="#15803d">前馈：运行前预先补偿已知扰动</text>
  <text x="320" y="64" text-anchor="middle" font-size="13" fill="#b91c1c">反馈：运行后测量输出再回环修正</text>
</svg>
