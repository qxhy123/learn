<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <!-- 编排层（最外） -->
  <rect x="20" y="20" width="560" height="360" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="300" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">编排层 Orchestration（最外）</text>
  <text x="300" y="70" text-anchor="middle" font-size="12.5" fill="#6d28d9">规划 · 执行 · 观察 · 调整 → 完成复杂任务</text>
  <!-- 运行时环境层 -->
  <rect x="80" y="92" width="440" height="288" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="300" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">运行时环境层 Runtime</text>
  <text x="300" y="142" text-anchor="middle" font-size="12.5" fill="#075985">重试 · 验证 · 状态管理 · 日志 · 指标 → 可靠地用模型</text>
  <!-- 模型接口层 -->
  <rect x="150" y="164" width="300" height="216" rx="13" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
  <text x="300" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#0e7490">模型接口层 Model Interface</text>
  <text x="300" y="214" text-anchor="middle" font-size="12" fill="#0e7490">组装请求 · 调用 · 解析输出</text>
  <!-- Model 核心 -->
  <rect x="225" y="240" width="150" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="300" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">Model</text>
  <text x="300" y="314" text-anchor="middle" font-size="12" fill="#15803d">模型</text>
</svg>
