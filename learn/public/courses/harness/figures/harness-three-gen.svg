<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect width="600" height="380" fill="#ffffff"/>
  <!-- 第三代 Harness 最外层 -->
  <rect x="20" y="20" width="560" height="340" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
  <text x="300" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#0e7490">第三代 · Harness Engineering（2026）</text>
  <text x="300" y="74" text-anchor="middle" font-size="13" fill="#0e7490">完整运行时系统：输出验证 · 错误恢复 · 状态管理 · 可观测 · 编排</text>
  <!-- 第二代 Context 中间层 -->
  <rect x="95" y="98" width="410" height="262" rx="15" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="300" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#a16207">第二代 · Context Engineering（2025）</text>
  <text x="300" y="148" text-anchor="middle" font-size="13" fill="#a16207">管输入端：检索 · 示例 · schema 组装上下文</text>
  <!-- 第一代 Prompt 最内层 -->
  <rect x="175" y="172" width="250" height="188" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="300" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">第一代</text>
  <text x="300" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Prompt Engineering</text>
  <text x="300" y="268" text-anchor="middle" font-size="13" fill="#15803d">（2023–2024）</text>
  <text x="300" y="296" text-anchor="middle" font-size="13" fill="#15803d">写好一段指令</text>
  <text x="300" y="332" text-anchor="middle" font-size="12.5" fill="#166534">层层包含，不是替代</text>
</svg>
