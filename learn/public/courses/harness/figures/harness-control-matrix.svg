<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect width="660" height="410" fill="#ffffff"/>

  <!-- 列表头 -->
  <rect x="160" y="20" width="240" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">计算型 Computational</text>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" fill="#1d4ed8">确定 · 快 · 便宜 · 范围内 100% 准</text>

  <rect x="408" y="20" width="232" height="52" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="524" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">推理型 Inferential</text>
  <text x="524" y="63" text-anchor="middle" font-size="11.5" fill="#7e22ce">判断 · 慢 · 贵 · 概率出错</text>

  <!-- 行表头 -->
  <rect x="20" y="80" width="132" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="86" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Guide</text>
  <text x="86" y="170" text-anchor="middle" font-size="12.5" fill="#15803d">前馈 · 之前</text>

  <rect x="20" y="238" width="132" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="86" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Sensor</text>
  <text x="86" y="328" text-anchor="middle" font-size="12.5" fill="#b91c1c">反馈 · 之后</text>

  <!-- Guide × Computational -->
  <rect x="160" y="80" width="240" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280" y="118" text-anchor="middle" font-size="12.5" fill="#334155">输出 JSON Schema 约束</text>
  <text x="280" y="142" text-anchor="middle" font-size="12.5" fill="#334155">工具白名单 / 权限限制</text>
  <text x="280" y="166" text-anchor="middle" font-size="12.5" fill="#334155">温度 · 参数设定</text>

  <!-- Guide × Inferential -->
  <rect x="408" y="80" width="232" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="524" y="118" text-anchor="middle" font-size="12.5" fill="#334155">LLM 规划 / 任务分解</text>
  <text x="524" y="142" text-anchor="middle" font-size="12.5" fill="#334155">动态挑选示例</text>
  <text x="524" y="166" text-anchor="middle" font-size="12.5" fill="#334155">用模型改写 prompt</text>

  <!-- Sensor × Computational -->
  <rect x="160" y="238" width="240" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280" y="276" text-anchor="middle" font-size="12.5" fill="#334155">JSON Schema 校验 · 正则</text>
  <text x="280" y="300" text-anchor="middle" font-size="12.5" fill="#334155">单元测试 · AST 分析</text>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#334155">范围内 100% 精确</text>

  <!-- Sensor × Inferential -->
  <rect x="408" y="238" width="232" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="524" y="276" text-anchor="middle" font-size="12.5" fill="#334155">LLM-as-Judge</text>
  <text x="524" y="300" text-anchor="middle" font-size="12.5" fill="#334155">语义相似度 · 意图分类</text>
  <text x="524" y="324" text-anchor="middle" font-size="12.5" fill="#334155">内容安全评估</text>

  <text x="330" y="404" text-anchor="middle" font-size="12.5" fill="#64748b">核心原则：能用计算型控制的地方，不要用推理型控制</text>
</svg>
